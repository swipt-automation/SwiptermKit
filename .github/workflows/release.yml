name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish. Empty derives <latest major.minor>.<UTC YYYYMMDD><NN> (NN: that day's revision, 01 first); pass one to move major or minor."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Release
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          LATEST=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)
          if [ -z "$VERSION" ]; then
            if [ -z "$LATEST" ]; then
              echo "::error::no package tag to derive major.minor from; pass version"
              exit 1
            fi
            TODAY=$(date -u +%Y%m%d)
            PATCH=${LATEST##*.}
            REVISION=1
            if [ "${PATCH:0:8}" = "$TODAY" ]; then
              REVISION=$((10#${PATCH:8} + 1))
            fi
            VERSION="${LATEST%.*}.$TODAY$(printf '%02d' "$REVISION")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semantic, for example 0.1.2026111901: $VERSION"
            exit 1
          fi
          if [ -n "$LATEST" ]; then
            NEWEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [ "$LATEST" = "$VERSION" ] || [ "$NEWEST" != "$VERSION" ]; then
              echo "::error::version must be newer than $LATEST: $VERSION"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BINARY_TAG="binary.$(git ls-files -s ish.ref build.sh Kernel Patches | git hash-object --stdin | cut -c1-12)"
          ROOTFS_TAG="rootfs.$(git ls-files -s rootfs.ref rootfs.sh Rootfs | git hash-object --stdin | cut -c1-12)"
          echo "binary-tag=$BINARY_TAG" >> "$GITHUB_OUTPUT"
          echo "rootfs-tag=$ROOTFS_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$BINARY_TAG" >/dev/null 2>&1; then
            echo "binary-exists=true" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$ROOTFS_TAG" >/dev/null 2>&1; then
            echo "rootfs-exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Binary
        if: steps.release.outputs.binary-exists != 'true'
        run: |
          brew install meson llvm lld
          ./build.sh kernel
          ditto -c -k --keepParent Frameworks/CSwiptermKit.xcframework build/CSwiptermKit.xcframework.zip
          gh release create "$TAG" build/CSwiptermKit.xcframework.zip \
            --title "$TAG" --notes "ish-arm64 $(cat ish.ref)" --prerelease
        env:
          TAG: ${{ steps.release.outputs.binary-tag }}

      - name: Download Binary
        if: steps.release.outputs.binary-exists == 'true'
        run: |
          gh release download "$TAG" --pattern CSwiptermKit.xcframework.zip --dir build
          ditto -x -k build/CSwiptermKit.xcframework.zip Frameworks
        env:
          TAG: ${{ steps.release.outputs.binary-tag }}

      - name: Build Rootfs
        if: steps.release.outputs.rootfs-exists != 'true'
        run: |
          ./build.sh rootfs
          ditto -c -k --keepParent Frameworks/CSwiptermAlpineRootfs.xcframework build/CSwiptermAlpineRootfs.xcframework.zip
          gh release create "$TAG" build/CSwiptermAlpineRootfs.xcframework.zip \
            --title "$TAG" --notes "$(head -1 rootfs.ref)" --prerelease
        env:
          TAG: ${{ steps.release.outputs.rootfs-tag }}

      - name: Download Rootfs
        if: steps.release.outputs.rootfs-exists == 'true'
        run: |
          gh release download "$TAG" --pattern CSwiptermAlpineRootfs.xcframework.zip --dir build
          ditto -x -k build/CSwiptermAlpineRootfs.xcframework.zip Frameworks
        env:
          TAG: ${{ steps.release.outputs.rootfs-tag }}

      - name: Test Package
        run: |
          cp Package.local.swift Package.swift
          xcodebuild build -quiet -scheme SwiptermKit-Package -destination 'generic/platform=iOS'
          xcodebuild build-for-testing -quiet -scheme SwiptermKit-Package -destination 'generic/platform=iOS Simulator' ARCHS=arm64

      - name: Generate Manifest
        run: |
          RELEASES="https://github.com/${{ github.repository }}/releases/download"
          BINARY_CHECKSUM="$(swift package compute-checksum build/CSwiptermKit.xcframework.zip)"
          ROOTFS_CHECKSUM="$(swift package compute-checksum build/CSwiptermAlpineRootfs.xcframework.zip)"
          perl -pe "s|path: \"Frameworks/CSwiptermKit.xcframework\"|url: \"$RELEASES/$BINARY_TAG/CSwiptermKit.xcframework.zip\",\n            checksum: \"$BINARY_CHECKSUM\"|; s|path: \"Frameworks/CSwiptermAlpineRootfs.xcframework\"|url: \"$RELEASES/$ROOTFS_TAG/CSwiptermAlpineRootfs.xcframework.zip\",\n            checksum: \"$ROOTFS_CHECKSUM\"|" \
            Package.local.swift > Package.swift
          if grep -q 'path: "Frameworks/' Package.swift; then
            echo "::error::Package.swift still refers to a local framework"
            exit 1
          fi
          git diff Package.swift
        env:
          BINARY_TAG: ${{ steps.release.outputs.binary-tag }}
          ROOTFS_TAG: ${{ steps.release.outputs.rootfs-tag }}

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release: $VERSION" || true
          git push
          gh release create "$VERSION" --target "$(git rev-parse HEAD)" --title "$VERSION" \
            --notes "ish-arm64 $(cat ish.ref), $(basename "$(head -1 rootfs.ref)")"
        env:
          VERSION: ${{ steps.release.outputs.version }}
