name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish. Empty derives <latest major.minor>.<UTC YYYYMMDD><NN> (NN: that day's revision, 01 first); pass one to move major or minor."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  resolve:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Guest Artifacts
        run: make -C Guest check

      - name: Resolve Release
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          LATEST=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)
          if [ -z "$VERSION" ]; then
            if [ -z "$LATEST" ]; then
              echo "::error::no package tag to derive major.minor from; pass version"
              exit 1
            fi
            TODAY=$(date -u +%Y%m%d)
            PATCH=${LATEST##*.}
            REVISION=1
            if [ "${PATCH:0:8}" = "$TODAY" ]; then
              REVISION=$((10#${PATCH:8} + 1))
            fi
            VERSION="${LATEST%.*}.$TODAY$(printf '%02d' "$REVISION")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semantic, for example 0.1.2026111901: $VERSION"
            exit 1
          fi
          if [ -n "$LATEST" ]; then
            NEWEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [ "$LATEST" = "$VERSION" ] || [ "$NEWEST" != "$VERSION" ]; then
              echo "::error::version must be newer than $LATEST: $VERSION"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build macOS
        run: swift build

      - name: Build iOS
        run: xcodebuild build -quiet -scheme SwiptermKit -destination 'generic/platform=iOS'

      - name: Build iOS Simulator
        run: xcodebuild build -quiet -scheme SwiptermKit -destination 'generic/platform=iOS Simulator' ARCHS=arm64

      - name: Publish
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "SwiptermKit $VERSION ($(git rev-parse --short HEAD))"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
