name: Guest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make xz-utils

      - name: Build Guest Artifacts
        run: go run ./internal/cmd/build_guest install

      - name: Commit Guest Artifacts
        run: |
          git add Sources/SwiptermKit/Resources/initramfs.cpio.gz Guest/artifacts.lock
          if git diff --cached --quiet; then
            echo "Guest artifacts are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update guest artifacts"
          git push
